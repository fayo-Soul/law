# Non-secret defaults only. Credentials and environment-specific hosts belong in .env.
[mysql]
host = 127.0.0.1
port = 3306
user = root
password =
database = fzt_law
law_qa_table = fzt_qa

[redis]
host = 127.0.0.1
port = 6379
password =
db = 1

[milvus]
host = 127.0.0.1
port = 19530
database_name = fzt_law
collection_name = fzt_legal_curated_v1
case_database_name = fzt_case
case_collection_name = fzt_case_hybrid

[llm]
model = qwen-plus
dashscope_api_key =
dashscope_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1

[retrieval]
parent_chunk_size = 512
child_chunk_size = 128
chunk_overlap = 50
retrieval_k = 5
candidate_m = 2

[logger]
log_file = logs/app.log

[app]
valid_sources = ["刑法", "民法", "劳动法", "行政法", "其他法"]
legal_qa_file = 法律问答.txt
customer_service_phone =

[api]
token =
researcher_token =
cors_origins = http://127.0.0.1:8000,http://localhost:8000
rate_limit_per_minute = 60
max_upload_mb = 20
document_registry_backend = mysql
index_queue_enabled = true
session_signing_key =
allow_internal_to_external_llm = false

[model]
model_dir = rag_qa/models
bert_classifier_dir = rag_qa/models/bert_law_classifier
bge_m3_dir = rag_qa/models/bge-m3
bge_reranker_dir = rag_qa/models/bge-reranker-large
